name: Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CI gate (smoke suite)
        run: python -m eval_bench.ci_gate --baseline runs/smoke_baseline.json --current runs/current.json --suite smoke --threshold 0.02

      - name: Build leaderboard
        run: python -m eval_bench.leaderboard --output reports/leaderboard.html
